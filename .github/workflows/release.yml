# Pushing a tag like v0.1.0 builds the release binaries install.sh downloads.
# Nothing is published until a tag is pushed.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Build
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}" arch="${target#*/}"
            dir="codeshot-$os-$arch"
            mkdir -p "$dir/shim"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X codeshot/internal/cli.Version=$GITHUB_REF_NAME" \
              -o "$dir/codeshot" ./cmd/codeshot
            cp shim/codeshot.zsh shim/codeshot.bash "$dir/shim/"
            cp README.md USAGE.md CHANGELOG.md "$dir/"
            tar -czf "$dir.tar.gz" "$dir"
          done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" codeshot-*.tar.gz --title "$GITHUB_REF_NAME" --notes-file notes.md
